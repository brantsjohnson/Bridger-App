<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Making Friends As An Adult Is Hard</title>
<style>
  :root{
    --accent:#5cc0d8;
    --ink:#06121a;
    --serif:"Didot","Bodoni MT","Hoefler Text",Georgia,"Times New Roman",serif;
    --g:min(70vw,300px);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;width:100%;background:#000;overflow:hidden;}
  body{display:flex;align-items:center;justify-content:center;font-family:var(--serif);}
  .screen{position:relative;width:100vw;height:100vh;max-width:430px;max-height:932px;background:#000;overflow:hidden;}

  /* Tunnel spokes (faint) */
  .tunnel{position:absolute;inset:0;z-index:1;
    background:repeating-conic-gradient(from 0deg at 50% 46%,
      rgba(255,255,255,.07) 0deg .3deg, transparent .3deg 12deg);}

  /* Tunnel rings flying forward (crisp, non-scaling stroke = no swelling edges) */
  .rings{position:absolute;inset:0;z-index:1;}
  .rings rect{fill:none;stroke:rgba(255,255,255,.28);stroke-width:1;
    vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center;
    animation:fly 16s linear infinite;}
  .rings rect:nth-of-type(1){animation-delay:0s;}
  .rings rect:nth-of-type(2){animation-delay:-1.6s;}
  .rings rect:nth-of-type(3){animation-delay:-3.2s;}
  .rings rect:nth-of-type(4){animation-delay:-4.8s;}
  .rings rect:nth-of-type(5){animation-delay:-6.4s;}
  .rings rect:nth-of-type(6){animation-delay:-8s;}
  .rings rect:nth-of-type(7){animation-delay:-9.6s;}
  .rings rect:nth-of-type(8){animation-delay:-11.2s;}
  .rings rect:nth-of-type(9){animation-delay:-12.8s;}
  .rings rect:nth-of-type(10){animation-delay:-14.4s;}
  @keyframes fly{
    0%{opacity:0;transform:scale(.04);}
    10%{opacity:.42;}
    90%{opacity:.42;}
    100%{opacity:0;transform:scale(1.9);}
  }

  /* Dense random micro-glitter with soft neon blur halos; two scattered layers */
  .glitterwrap{position:absolute;inset:0;z-index:2;mix-blend-mode:screen;
    filter:drop-shadow(0 0 1.5px rgba(255,255,255,.9))
           drop-shadow(0 0 3px rgba(110,230,255,.7))
           drop-shadow(0 0 6px rgba(185,107,255,.55));}
  .glitterwrap.a{opacity:.6;}   /* 40% transparent */
  .glitterwrap.b{opacity:.4;}   /* 60% transparent */
  .glitter{position:absolute;inset:0;width:100%;height:100%;animation:huedrift 26s linear infinite;}
  @keyframes huedrift{to{filter:hue-rotate(360deg);}}
  .glitter use{animation:tw 3s ease-in-out infinite;}
  @keyframes tw{0%,100%{opacity:.06;}50%{opacity:1;}}

  .cta-wrap{position:absolute;left:0;right:0;bottom:9%;z-index:6;display:flex;justify-content:center;}
  .cta{appearance:none;border:none;cursor:pointer;font-family:var(--serif);font-weight:600;

    padding:20px 74px;border-radius:40px;transition:transform .18s ease;}

  .cta:active{transform:translateY(0) scale(.99);}
  .cta:focus-visible{outline:3px solid #fff;outline-offset:4px;}

    .rings rect:nth-of-type(4){opacity:.35;transform:scale(.9);}
    .rings rect:nth-of-type(6){opacity:.2;transform:scale(1.35);}
  }
