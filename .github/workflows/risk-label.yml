# ============================================
# WHAT THIS FILE DOES (plain English):
# On every pull request, look at which files changed and stamp the PR with a
# "risk:low" or "risk:high" label using scripts/risk-tier.mjs. Low means the
# auto-merge workflow may merge it once CI is green. High means Brant reviews.
# Nobody but Brant removes "risk:high"; if a human added it, this job keeps it.
# ============================================
name: Risk label

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # THIS STEP DOES: list changed files vs the base branch and classify them.
      - name: Classify the diff
        id: risk
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed.txt
          node scripts/risk-tier.mjs --stdin --json < changed.txt > risk.json
          cat risk.json
          echo "tier=$(node -e "console.log(JSON.parse(require('fs').readFileSync('risk.json','utf8')).tier)")" >> "$GITHUB_OUTPUT"

      # THIS STEP DOES: make sure the labels exist, then apply the right one.
      - name: Apply label
        uses: actions/github-script@v7
        with:
          script: |
            const tier = '${{ steps.risk.outputs.tier }}';
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const wanted = [
              { name: 'risk:low', color: '0e8a16', description: 'Auto-merges when CI is green' },
              { name: 'risk:high', color: 'b60205', description: 'Brant reviews before merge' },
              { name: 'risk:block', color: '000000', description: 'Do not merge; ask first' },
              { name: 'agent:cursor', color: '5319e7', description: 'Owned by Cursor' },
              { name: 'agent:claude', color: '1d76db', description: 'Owned by Claude' },
              { name: 'agent:grokbot', color: 'fbca04', description: 'Owned by Grokbot' }
            ];
            for (const l of wanted) {
              try { await github.rest.issues.getLabel({ owner, repo, name: l.name }); }
              catch { await github.rest.issues.createLabel({ owner, repo, ...l }); }
            }
            const current = context.payload.pull_request.labels.map(l => l.name);
            const humanHeld = current.includes('risk:high') || current.includes('risk:block');
            const finalTier = (tier === 'high' || humanHeld) ? 'high' : 'low';
            // Never downgrade a label a person placed. Only add the computed one.
            if (finalTier === 'high' && current.includes('risk:low')) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: 'risk:low' }).catch(() => {});
            }
            if (finalTier === 'low' && current.includes('risk:high') && !humanHeld) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: 'risk:high' }).catch(() => {});
            }
            const add = finalTier === 'high' ? 'risk:high' : 'risk:low';
            if (!current.includes(add)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: [add] });
            }
            const reasons = JSON.parse(require('fs').readFileSync('risk.json', 'utf8')).reasons;
            if (finalTier === 'high' && reasons.length) {
              const body = ['**Risk label: high.** Brant reviews this one. Reasons:', '', ...reasons.map(r => `- ${r}`), '', 'See `ops/RISK-TIERS.md`.'].join('\n');
              const comments = await github.rest.issues.listComments({ owner, repo, issue_number: number });
              if (!comments.data.some(c => c.body && c.body.startsWith('**Risk label: high.**'))) {
                await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
              }
            }
