# ============================================
# WHAT THIS FILE DOES (plain English):
# Scans every push and pull request for things that look like secrets (API
# keys, tokens, private keys). A live Magic Patterns token was once committed
# to this repo; this is the tripwire so it does not happen again. Uses the
# open source gitleaks scanner. It is a required check for auto-merge.
# ============================================
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code (full history so leaks in old commits are found too)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
